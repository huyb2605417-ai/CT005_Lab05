<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lợi ích của công nghệ số trong học tập</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8ff;
            color: #222;
        }

        .container {
            width: min(1100px, 92%);
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #1455b8;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 24px;
            margin-bottom: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #1455b8;
            margin-top: 0;
        }

        .infographic {
            display: block;
            width: 100%;
            max-width: 768px;
            height: auto;
            margin: 0 auto;
            border-radius: 10px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 12px;
        }

        footer {
            text-align: center;
            color: #666;
            padding: 10px 0 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Lợi ích của công nghệ số trong học tập</h1>
        <p class="intro">
            Infographic và video minh họa về vai trò của công nghệ số trong học tập.
        </p>

        <section class="card">
    <h2>Infographic</h2>
    <img
        class="infographic"
        src="https://www.facebook.com/photo/?fbid=122230256726560596&set=a.122177013656560596"
        alt="Infographic Lợi ích của công nghệ số trong học tập"
    >
</section>

        <section class="card">
            <h2>Video YouTube</h2>
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/x3XcD2gXgVY"
                    title="Video YouTube"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <footer>
            Infographic tạo bởi Canva AI; hình ảnh sử dụng theo nguồn và giấy phép được ghi chú trên infographic.
        </footer>
    </main>
</body>
</html>
